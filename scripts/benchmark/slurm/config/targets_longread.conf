# Long-read Benchmark Targets
# Format: TARGET_ID|ORGANISM_PATH|SIZE_CLASS|GENOME_SIZE_GB
#
# These targets use synthetic long reads generated by gen_synthetic_long.py.
# Each target should have corresponding reads in $DATA_ROOT/<path>/reads/reads_1.fq
#
# T9 targets are sized for long-read benchmarking (10-50 kb reads):
# T9a: E. coli K-12MG1655 (~4.6 Mb) — bacterial single chromosome, good for testing
# T9b: E. coli Sakai (~5.2 Mb) — another bacterial test case
# T9c: Human chromosome 21 (~48 Mb) — mammalian chromosome, tests longer reads
#
# NOTE: GENOME_SIZE_GB values are placeholders. Run an agent to populate from
# actual genome sizes.

# Small bacterial targets for ONT/PacBio CLR benchmarking
T9a|ecoli_k12_mg1655|long-read|0.0046
T9b|ecoli_sakai|long-read|0.0052

# Medium mammalian target for longer read testing
T9c|homo_sapiens/chr21|long-read|0.0481
