# Long-read Benchmark Targets (T9 series)
# Format: TARGET_ID|ORGANISM_PATH|SIZE_CLASS|GENOME_SIZE_GB
#
# Mirrors the data-commons manifests under test/benchmarking/alignment/ (each manifest's "id"
# and directory name; GENOME_SIZE_GB = manifest genome_size_bp / 1e9). Data layout per target,
# produced by data-commons acquire.py:
#   <ORGANISM_PATH>/data/reference/reference.fasta
#   <ORGANISM_PATH>/data/reads/reads_1.fq              (uncompressed, single-end)
#   <ORGANISM_PATH>/data/reads/reads_1.fq.truth.tsv    (simulated targets only)
# Simulated by data-commons scripts/gen_long_reads.py; truth is scored within +/-100 bp by
# utils/long_read_accuracy.py.

# T9a: E. coli K-12 MG1655, 2,000 reads, 10-30 kb, 12% error (baseline)
T9a|escherichia_coli/k12_mg1655|long-read|0.004641652
# T9a read-count sweep (same seed -> prefixes of T9a's reads). Reported in score.py's amortization
# table and excluded from the aggregate CAS/BNT/MEI (manifest "sweep_of": "T9a").
T9a-n100|escherichia_coli/k12_mg1655_n100|long-read|0.004641652
T9a-n500|escherichia_coli/k12_mg1655_n500|long-read|0.004641652
T9a-n10000|escherichia_coli/k12_mg1655_n10000|long-read|0.004641652
# T9b: E. coli O157:H7 Sakai chromosome, 8% error
T9b|escherichia_coli/sakai|long-read|0.005498578
# T9c: human chr21 (46.7 Mb), 10-50 kb reads
T9c|homo_sapiens/chr21|long-read|0.046709983
# T9d: ultra-long reads (50-100 kb)
T9d|escherichia_coli/k12_mg1655_ultralong|long-read|0.004641652
# T9e: high error (18%)
T9e|escherichia_coli/k12_mg1655_higherr|long-read|0.004641652
# T9f: planted 20 kb segmental duplication; PA is ambiguous by design (compare n_correct_any)
T9f|escherichia_coli/k12_mg1655_segdup|long-read|0.004661658
# T9g: real ONT reads (SRR8184499, first 10,000), no truth: wall/RSS/agreement only, PA is null
T9g|escherichia_coli/k12_mg1655_real_ont|long-read|0.004641652
