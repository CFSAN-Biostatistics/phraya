# Assembly-pair Benchmark Targets (T10 series)
# Format: TARGET_ID|ORGANISM_PATH|SIZE_CLASS|GENOME_SIZE_GB
#
# Real CSP2 genome-vs-genome pairs (draft skesa assemblies) under
# /isilon/reggen/RAL_Pipelines/CSP2_Test/. ORGANISM_PATH is <run>/<ref_id>_vs_<qry_id>;
# GENOME_SIZE_GB is the reference assembly size. Benchmarked with wrappers/dnadiff.sh vs
# phraya --strategy assembly, scored by utils/snpdiffs_concordance.py.
#
# Moved out of targets.conf, which is now the short-read DNA set only. run_benchmark.sh has no
# assembly-pair alphabet yet, so nothing submits this file; it is the record of the targets.
#
# T10a: divergent pair (~99.2% identity, ~19k SNPs) - CSP2 halts it as SNP_Cutoff, so only the
# cutoff classification and aligner-level agreement matter.
T10a|CSP2_Test/CSP2_1764630849341/SRR30874442_vs_SRR30874443|assembly-pair|0.002953
# T10b: close pair (outbreak-level): SRR30874455 vs SRR30874458, dnadiff 3 SNPs / 3 indel rows.
# Scored with --csp2-filter; every filtered set is empty, so this checks breadth and headers only.
T10b|CSP2_Test/CSP2_1764630849341/SRR30874455_vs_SRR30874458|assembly-pair|0.002753
# T10c: mid pair (100-10,000 variants). No natural CSP2_Test pair falls in this range (the 55
# pairs have 0-7 or more than 20,000), so the query is SRR30874442 with events planted by
# scripts/benchmark/local/plant_variants.py: mb300/mb3000/mb8000 use N_EVENTS = 300/3000/8000
# with SEED = N_EVENTS + 11, and mb9900 sits at SNP_Cutoff to check the classification.
# The generated pairs are not under $DATA_ROOT: they live in ~/snph4/midband on reedling2 and
# must be regenerated (planter output is byte-identical for a given seed; verified for all four).
T10c|midband/mb3000|assembly-pair|0.002953
