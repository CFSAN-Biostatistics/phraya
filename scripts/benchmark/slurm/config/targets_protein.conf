# Protein-space Aligner Benchmark Targets (ADR-0013)
# Format: TARGET_ID|ORGANISM_PATH|SIZE_CLASS|PROTEOME_RESIDUES
#
# Unlike targets.conf (real staged genomes, reads simulated externally by
# dwgsim), there is no standard "real proteome + query set with known ground
# truth" corpus to stage. Each row here is generated once by
# gen_synthetic_protein.py at the given scale and staged like STREAM Triad's
# one-time platform characterization — not sourced externally. Reuses the same
# organism labels as targets.conf's small tier so DNA and protein results are
# comparable per-organism at a glance, though the protein sequences themselves
# are synthetic, not real translated CDS from those organisms.
#
# NOTE: PROTEOME_RESIDUES values are placeholders (0), matching targets.conf's
# existing placeholder convention for GENOME_SIZE_GB. Populate by summing
# sequence lengths from the generated proteome FASTA once staged.
#
# Generation (run once per target before benchmarking):
#   python3 scripts/benchmark/local/gen_synthetic_protein.py \
#       --num-proteins <N> --protein-len <L> --num-queries <Q> --query-len <L> \
#       --divergence 0.02 --seed <TARGET_ID-derived seed> \
#       --proteome-out $DATA_ROOT/protein/<target>/proteome.fasta \
#       --queries-out $DATA_ROOT/protein/<target>/queries.fasta

# Small targets — fast iteration, initial validation (mirrors T3-T6 DNA scale)
P1|mycobacterium_tuberculosis/h37rv|small|0
P2|staphylococcus_aureus/mrsa252|small|0
P3|clostridioides_difficile/630|small|0

# Medium targets — representative protein-search workloads
P4|homo_sapiens/chr1|medium|0
